[project]
name = "weatherbot"
version = "0.1.0"
description = "Automated Polymarket weather-market trading bot driven by ensemble forecast probabilities"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    # Windows has no system IANA timezone database; zoneinfo needs this there.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Live trading is deliberately an optional extra. A default `uv sync` cannot
# place real orders because the order-signing client is not even installed.
live = [
    "py-clob-client>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
weatherbot = "weatherbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
